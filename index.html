<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dojang HQ – Supreme Taekwondo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root{--bg:#F4F5F8;--sf:#fff;--ink:#14182B;--mu:#5B6177;--ln:#DCDFE8;--bl:#1D3FA6;--rd:#C8102E;--ok:#1E7B4F;--tint:#E8EDFB;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1220;--sf:#181C30;--ink:#EEF0F8;--mu:#9AA1B8;--ln:#2A2F48;--bl:#8AA4FF;--rd:#FF7088;--ok:#5FD39A;--tint:#222849;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1220;--sf:#181C30;--ink:#EEF0F8;--mu:#9AA1B8;--ln:#2A2F48;--bl:#8AA4FF;--rd:#FF7088;--ok:#5FD39A;--tint:#222849;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Barlow,system-ui,sans-serif;display:grid;grid-template-columns:230px 1fr;min-height:100vh}
body.standalone-portal{grid-template-columns:1fr}
body.standalone-portal nav{display:none}
body.standalone-portal main{margin:0 auto;max-width:880px}
h1,h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
h1{font-size:34px;line-height:1.05}h2{font-size:22px}h3{font-size:18px}
nav{background:var(--sf);border-right:1px solid var(--ln);padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.brand{font:700 22px/1.1 "Barlow Condensed",Impact,sans-serif;padding:0 10px 16px}
.brand small{display:block;font:400 12px Barlow,sans-serif;color:var(--mu)}
nav button{all:unset;cursor:pointer;padding:9px 10px;border-radius:6px;color:var(--mu);font-weight:500}
nav button[aria-current=true]{background:var(--tint);color:var(--bl);font-weight:600}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--bl);outline-offset:2px}
main{padding:28px 32px;max-width:1060px;width:100%;min-width:0}
.top{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.next{border-left:4px solid var(--rd);padding:2px 0 2px 12px}
.next b{display:block;font-size:17px}.mu{color:var(--mu)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-block:1px solid var(--ln);margin-bottom:26px}
.kpi{padding:14px 16px;border-left:1px solid var(--ln)}.kpi:first-child{border-left:0;padding-left:0}
.kpi strong{display:block;font:700 34px/1.1 "Barlow Condensed",Impact,sans-serif}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.sec{margin-bottom:28px;min-width:0}.sec h2{margin-bottom:10px}
.belt{display:flex;height:34px;border:1px solid var(--ln);border-radius:4px;overflow:hidden}
.belt i{display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;font-size:13px;color:var(--mu)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;border:1px solid var(--ln);margin-right:5px}
.bars{display:flex;align-items:flex-end;gap:8px;height:120px;border-bottom:1px solid var(--ln)}
.bars div{flex:1;background:var(--bl);border-radius:3px 3px 0 0;position:relative;min-height:4px}
.bars span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:12px;color:var(--mu)}
.xl{display:flex;gap:8px;font-size:12px;color:var(--mu)}.xl span{flex:1;text-align:center}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--ln);align-items:center}
.btn{all:unset;cursor:pointer;background:var(--bl);color:#fff;padding:8px 14px;border-radius:6px;font-weight:600;display:inline-block}
:root[data-theme="dark"] .btn,:root:not([data-theme="light"]) .btn{color:#0F1220}
.btn.ghost{background:transparent;color:var(--bl);border:1px solid var(--bl)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{all:unset;cursor:pointer;padding:6px 12px;border:1px solid var(--ln);border-radius:999px;background:var(--sf)}
.chip[aria-pressed=true]{border-color:var(--bl);background:var(--tint);color:var(--bl);font-weight:600}
.meter{height:10px;background:var(--ln);border-radius:5px;overflow:hidden;margin:6px 0 12px}.meter i{display:block;height:100%;background:var(--ok)}
.sk{display:grid;grid-template-columns:100px 1fr 36px;gap:8px;align-items:center;margin:6px 0;font-size:14px}
.sk .meter{margin:0}.sk .meter i{background:var(--bl)}
textarea,select,input[type=datetime-local]{width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:6px;padding:10px}
label.tg{display:flex;gap:8px;align-items:center;margin:6px 0}
.pv{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px;white-space:pre-wrap;min-height:120px}
.pill{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--tint);color:var(--bl)}
.pill.ok{background:rgba(30,123,79,.15);color:var(--ok);font-weight:600}
.pill.warn{background:rgba(200,16,46,.15);color:var(--rd);font-weight:600}
.pill.leave{background:rgba(242,182,0,.22);color:#9A6E00;font-weight:600}
:root[data-theme="dark"] .pill.leave,:root:not([data-theme="light"]) .pill.leave{color:#F5C842}
.note{background:var(--tint);border-radius:6px;padding:10px 12px;font-size:14px;margin-bottom:14px}
details{border-bottom:1px solid var(--ln);padding:10px 0}summary{cursor:pointer;font-weight:600}
details p{margin:6px 0 0;color:var(--mu)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:6px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9999}
#toast.on{opacity:1}
@media (max-width:760px){body{grid-template-columns:1fr}nav{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:10px;align-items:center}.brand{display:none}nav button{white-space:nowrap}main{padding:20px 16px}.grid{grid-template-columns:1fr}h1{font-size:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:root{--bg:#EDF0F7;--sh:0 1px 2px rgba(20,24,43,.06),0 10px 28px -14px rgba(20,24,43,.25)}
main{max-width:1120px}
nav{background:#0E1430;border:0;padding:22px 14px}
.brand{color:#fff;font-size:26px;position:relative;padding-bottom:26px}
.brand small{color:#9AA4D0}
.brand::after{content:"";position:absolute;left:10px;bottom:10px;width:64px;height:6px;border-radius:3px;background:linear-gradient(90deg,#111 0 70%,#C8102E 70%);outline:1px solid #3A4272}
nav button{color:#B8C0E6;padding:11px 12px;border-radius:10px;display:flex;gap:10px;align-items:center}
nav button:hover{background:#1A2250;color:#fff}
nav button[aria-current=true]{background:#fff;color:#13247C}
.unit-sw{margin:4px 0 10px;padding:0 6px}
.unit-sw label{color:#9AA4D0;font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.unit-sw select{background:#1A2250;color:#fff;border:1px solid #3A4272;border-radius:8px;padding:7px 9px;font-size:13px;font-weight:600}
@media (max-width:760px){.unit-sw{margin:0;min-width:150px}.unit-sw label{display:none}}
.top h1{font-size:40px}
.hero{display:grid;grid-template-columns:1.7fr 1fr;border-radius:20px;overflow:hidden;color:#fff;margin-bottom:24px;box-shadow:var(--sh);background:linear-gradient(105deg,#13247C 0 63%,#C8102E 63% 100%)}
.hl{padding:32px}.hl span{opacity:.75;font-size:14px}.hl h1{font-size:48px;margin:6px 0 4px}.hl p{margin:0;opacity:.8}
.hr{padding:32px 28px 32px 48px;display:flex;flex-direction:column;justify-content:center}.hr span{opacity:.9;font-size:14px}.hr b{font:700 36px/1.05 "Barlow Condensed",Impact,sans-serif;margin:4px 0}.hr small{opacity:.9;font-size:14px}
.kpis{border:0;gap:14px}
.kpi,.kpi:first-child{background:var(--sf);border:0;border-top:4px solid var(--bl);border-radius:16px;padding:18px;box-shadow:var(--sh)}
.kpi:nth-child(2){border-top-color:var(--ok)}.kpi:nth-child(3){border-top-color:var(--rd)}.kpi:nth-child(4){border-top-color:#F2B600}
.kpi strong{font-size:46px}
.sec{background:var(--sf);border-radius:16px;padding:22px;box-shadow:var(--sh)}
.grid{gap:20px}.grid>.sec{margin-bottom:0}
.sec h2{font-size:24px;margin-bottom:14px}
.belt{height:48px;border:0;border-radius:12px;gap:3px;background:var(--ln)}.belt i{border-radius:6px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.bars{height:150px;gap:10px;border-bottom:0}.bars div{background:linear-gradient(180deg,#4A6AE0,#1D3FA6);border-radius:8px}.bars div:last-child{background:linear-gradient(180deg,#F0506A,#C8102E)}
.meter{height:12px;border-radius:6px}.meter i{background:linear-gradient(90deg,#2E9E5B,#5FD39A)}.sk .meter i{background:linear-gradient(90deg,#1D3FA6,#6C8BFF)}
:root:root:root .btn{background:linear-gradient(135deg,#1D3FA6,#3860E0);color:#fff;padding:10px 18px;border-radius:10px;box-shadow:0 8px 18px -8px rgba(29,63,166,.7)}
:root:root:root .btn.ghost{background:transparent;color:var(--bl);box-shadow:none}
.chip{padding:6px 14px;display:inline-flex;gap:8px;align-items:center;box-shadow:var(--sh)}
.chip[aria-pressed=true]{background:#13247C;color:#fff;border-color:#13247C}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font:700 16px "Barlow Condensed",Impact,sans-serif;color:#111;border:2px solid rgba(0,0,0,.22)}
.pv{border-radius:14px;background:var(--bg)}
.note{border-left:4px solid var(--bl);border-radius:10px}
.row{padding:13px 0}details{padding:13px 0}
@media (max-width:760px){.hero{grid-template-columns:1fr;background:linear-gradient(172deg,#13247C 0 62%,#C8102E 62% 100%)}.hl h1{font-size:34px}.hr{padding:20px 32px 28px}}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label{font-size:13px;color:var(--mu);display:block;margin-bottom:3px}label.row,label.tg{font-size:15px;color:var(--ink)}
input:not([type=checkbox]):not([type=file]):not([type=range]){width:100%;font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:9px}
:root:root:root .btn.dn{color:var(--rd);border-color:var(--rd)}
nav{overflow-y:auto}
.ev{display:flex;gap:10px;flex-wrap:wrap}.ev label{margin:0}.ev select{width:72px;padding:6px;border-radius:8px}
#pinGate{position:fixed;inset:0;background:#0E1430;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9000}
#pinGate .card{background:var(--sf);color:var(--ink);max-width:380px;width:100%;padding:28px;border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.filter-box{background:var(--bg);padding:12px 14px;border-radius:12px;margin-bottom:14px}
.filter-top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.filter-chips{display:flex;gap:6px;flex-wrap:wrap}
.filter-chips .chip{padding:4px 10px;font-size:13px;box-shadow:none}
.tbl-wrap{overflow-x:auto}
table.att-tbl{width:100%;border-collapse:collapse;font-size:14px}
table.att-tbl th,table.att-tbl td{padding:9px 8px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
table.att-tbl th{font-size:12px;color:var(--mu);text-transform:uppercase;letter-spacing:.04em}
table.att-tbl td.c,table.att-tbl th.c{text-align:center}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E1430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dojang HQ">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
<div id="pinGate" style="display:none">
  <div class="card">
    <h2 style="font-size:28px;margin-bottom:4px">Dojang HQ</h2>
    <p class="mu" style="margin:0 0 18px">Supreme Taekwondo · Masukkan PIN Admin</p>
    <input id="pinInp" type="password" inputmode="numeric" placeholder="Masukkan PIN..." style="margin-bottom:12px;font-size:18px;letter-spacing:2px">
    <p id="pinErr" style="color:var(--rd);font-size:13px;margin:0 0 12px;display:none">PIN salah. Silakan coba lagi.</p>
    <button id="pinBtn" class="btn" style="width:100%;text-align:center">Masuk ke Dojang HQ</button>
  </div>
</div>
<nav aria-label="Menu utama">
 <div class="brand">Dojang HQ<small>Supreme Taekwondo</small></div>
 <button data-v="dash">🥋 Dashboard</button><button data-v="lap">📊 Laporan murid</button><button data-v="kon">📸 Konten &amp; Instagram</button><button data-v="fit">🧭 Fitur yang dibutuhkan</button>
</nav>
<main id="app"></main>
<div id="toast" role="status"></div>
<script>
const params=new URLSearchParams(location.search);
const portalId=(params.get("portal")||"").trim();
const isCoachPortal=params.has("pelatih")||params.has("coach");

const mk=(c,t,n)=>n==1?`linear-gradient(90deg,${c} 0 38%,${t} 38% 62%,${c} 62%)`:n==2?`linear-gradient(90deg,${c} 0 28%,${t} 28% 42%,${c} 42% 58%,${t} 58% 72%,${c} 72%)`:c;
const BL=[["Putih",mk("#FFFFFF")],["Kuning",mk("#F2C200")],["Kuning strip",mk("#F2C200","#2E9E5B",1)],["Hijau",mk("#2E9E5B")],["Hijau strip",mk("#2E9E5B","#2457C5",1)],["Biru",mk("#2457C5")],["Biru strip",mk("#2457C5","#C8102E",1)],["Merah",mk("#C8102E")],["Merah strip 1",mk("#C8102E","#111111",1)],["Merah strip 2",mk("#C8102E","#111111",2)],["Hitam",mk("#111111")]],SK=["Poomsae","Kyorugi","Kekuatan","Kelenturan","Disiplin"],RP=500000;
const DEFAULT_UNITS=["Terazza","Chevalier PIK 2"];
const BELT_CATS=[
  ["all","Semua","#888"],
  ["putih","Putih","#FFFFFF"],
  ["kuning","Kuning","#F2C200"],
  ["hijau","Hijau","#2E9E5B"],
  ["biru","Biru","#2457C5"],
  ["merah","Merah","#C8102E"],
  ["hitam","Hitam","#111111"]
];
const matchBeltCat=(bi,cat)=>{
  if(cat==="all")return true;
  if(cat==="putih")return bi===0;
  if(cat==="kuning")return bi===1||bi===2;
  if(cat==="hijau")return bi===3||bi===4;
  if(cat==="biru")return bi===5||bi===6;
  if(cat==="merah")return bi===7||bi===8||bi===9;
  if(cat==="hitam")return bi===10;
  return true;
};

const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ymd=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const hm=()=>new Date().toTimeString().slice(0,5);
const rp=n=>"Rp"+(Number(n)||0).toLocaleString("id-ID");
const wan=x=>{x=String(x||"").replace(/\D/g,"");return x.startsWith("0")?"62"+x.slice(1):x};
const slug=s=>String(s||"").trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"item";
const $=s=>document.querySelector(s);
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),2500)}
function radar(sk){const k=Object.keys(sk),c=110,r=78;const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/k.length;return[(c+Math.cos(a)*r*v/100).toFixed(1),(c+Math.sin(a)*r*v/100).toFixed(1)]};
const poly=v=>k.map((_,i)=>pt(i,v).join(",")).join(" ");
const own=k.map((x,i)=>pt(i,sk[x]).join(",")).join(" ");
const lb=k.map((x,i)=>{const[p,q]=pt(i,122);return`<text x="${p}" y="${q}" text-anchor="middle" font-size="12" fill="var(--mu)">${x}</text>`}).join("");
return`<svg viewBox="0 0 220 220" width="100%" style="max-width:300px" role="img" aria-label="Grafik keterampilan: ${k.map(x=>x+" "+sk[x]).join(", ")}"><polygon points="${poly(100)}" fill="none" stroke="var(--ln)"/><polygon points="${poly(50)}" fill="none" stroke="var(--ln)"/><polygon points="${own}" fill="var(--bl)" fill-opacity=".25" stroke="var(--bl)" stroke-width="2"/>${lb}</svg>`}

if(portalId){
  document.body.classList.add("standalone-portal");
  const ymNow=ymd().slice(0,7);
  $("#app").innerHTML=`<div class="sec"><h2>Memuat Portal Orang Tua...</h2><p class="mu">Mohon tunggu sebentar.</p></div>`;
  fetch("/api/portal?id="+encodeURIComponent(portalId),{cache:"no-store"})
    .then(r=>r.ok?r.json():Promise.reject(r.status))
    .then(data=>{
      const d=data.student;
      const sUnit=d.unit||"Terazza";
      const sFee=(d.fee!==undefined&&d.fee!==null&&Number(d.fee)>=0)?Number(d.fee):RP;
      const bi=d.v==2?(d.bi||0):[0,1,3,5,7,10][d.bi||0];
      const beltName=BL[bi][0],beltColor=BL[bi][1];
      const nextBelt=bi<10?BL[bi+1][0].toLowerCase():"dan";
      const sk=d.sk||{};SK.forEach(k=>sk[k]=sk[k]??50);
      const since=d.sejak||"0000-00-00";
      const sesSince=data.attendance.filter(x=>x.id>=since);
      const attRate=sesSince.length?sesSince.filter(x=>x.hadir).length/sesSince.length:0;
      const evSince=data.evaluations.filter(x=>(x.date||x.id)>=since);
      const r=[];evSince.forEach(x=>["t","k","f"].forEach(k=>{if(Number.isFinite(x[k]))r.push(x[k])}));
      const scRate=r.length?r.reduce((p,c)=>p+c,0)/r.length/5:0;
      const pct=Math.round((scRate*0.7+attRate*0.3)*100);
      const attTotal=data.attendance.length?Math.round(data.attendance.filter(x=>x.hadir).length/data.attendance.length*100):0;

      const payCur=data.payments.find(x=>x.id===ymNow);
      const isLunas=!!(payCur&&payCur.lunas);
      const recentAtt=[...data.attendance].sort((a,b)=>a.id<b.id?1:-1).slice(0,8);
      const recentEv=[...data.evaluations].sort((a,b)=>(a.date||a.id)<(b.date||b.id)?1:-1);
      const av=k=>{const v=recentEv.map(x=>x[k]).filter(Number.isFinite);return v.length?(v.reduce((p,c)=>p+c,0)/v.length).toFixed(1):"–"};
      const unitClasses=data.classes.filter(c=>(c.unit||"Terazza")===sUnit);
      const nc=unitClasses[0]||data.classes[0];
      const waKonfirm="Halo Sabeum Shandy, saya orang tua/wali dari "+d.n+" (Unit "+sUnit+") ingin konfirmasi iuran bulan "+ymNow+" ("+rp(sFee)+") di Supreme Taekwondo.";
      const cutiBanner=d.cuti?`<div class="note" style="border-left-color:#F2B600"><b>Status Murid: Sedang Cuti</b>${d.cutiKet?" · "+esc(d.cutiKet):""}${d.cutiTgl?" (sejak "+esc(d.cutiTgl)+")":""}</div>`:"";

      $("#app").innerHTML=`
        <div class="hero">
          <div class="hl">
            <span>Portal Orang Tua · Supreme Taekwondo · Unit ${esc(sUnit)}</span>
            <h1>${esc(d.n)}</h1>
            <p>${d.gender?esc(d.gender)+" · ":""}${d.a?d.a+" tahun · ":""}Sabuk ${esc(beltName)} · Unit ${esc(sUnit)}${d.cuti?" · Sedang Cuti":""}</p>
          </div>
          <div class="hr">
            <span>Jadwal kelas (${esc(sUnit)})</span>
            <b>${nc?esc(nc.h)+"<br>"+esc(nc.j):"Hubungi<br>Pelatih"}</b>
            <small>${nc?esc(nc.l)+" · "+esc(nc.p):"Supreme Taekwondo "+esc(sUnit)}</small>
          </div>
        </div>
        ${cutiBanner}
        <div class="kpis">
          <div class="kpi"><strong>${pct}%</strong>Progres ke sabuk ${nextBelt}</div>
          <div class="kpi"><strong>${attTotal}%</strong>Kehadiran total</div>
          <div class="kpi"><strong>${d.cuti?"Cuti":(isLunas?"Lunas":"Belum")}</strong>Status iuran ${ymNow}</div>
          <div class="kpi"><strong>${d.cuti?"Cuti":(d.siap?"Siap":"Proses")}</strong>Status ujian sabuk</div>
        </div>
        <div class="grid">
          <div class="sec">
            <h2>Perkembangan &amp; Catatan Pelatih</h2>
            <p class="mu" style="margin:0 0 12px"><span class="dot" style="background:${beltColor}"></span>Sabuk ${esc(beltName)} · Unit ${esc(sUnit)} ${d.sejak?"(sejak "+esc(d.sejak)+")":""}</p>
            <b>Progres menuju sabuk ${nextBelt}: ${pct}%</b>
            <div class="meter"><i style="width:${pct}%"></i></div>
            <b>Kehadiran latihan: ${attTotal}%</b>

function getCoaches(){
  const m=new Map();
  ["Sabeum Shandy","Master Juwono"].forEach(n=>m.set(slug(n),n));
  try{JSON.parse(localStorage.getItem("dojang_coaches")||"[]").forEach(c=>{if(c)m.set(slug(c),c)})}catch(e){}
  CList.forEach(c=>{if(c.name)m.set(slug(c.name),c.name)});
  J.forEach(c=>String(c.p||"").split(",").forEach(p=>{const t=p.trim();if(t)m.set(slug(t),t)}));
  E.forEach(x=>{if(x.coach)m.set(slug(x.coach),x.coach)});
  if(coachName.trim())m.set(slug(coachName),coachName.trim());
  return [...m.values()];
}
function rememberCoach(name){

<div class="sec"><h2>Tambah &amp; Kelola Jadwal Kelas (${esc(unitLabel())})</h2><datalist id="unitList">${units.map(u=>`<option value="${esc(u)}">`).join("")}</datalist><div class="f"><div><label>Unit Dojang</label><input id="ju" type="text" list="unitList" value="${esc(defU)}"></div><div><label>Hari</label><input id="jh" type="text" placeholder="Selasa"></div><div><label>Jam</label><input id="jj" type="text" placeholder="18.00 – 20.00"></div><div><label>Lokasi</label><input id="jl" type="text" placeholder="Terazza 301 / PIK 2"></div><div><label>Pelatih</label><input id="jp" type="text" placeholder="Sabeum Shandy"></div></div><p><button class="btn" data-a="cls">Simpan kelas</button></p>${uClasses.length?uClasses.map(c=>`<div class="row"><span><b>${esc(c.h)}, ${esc(c.j)}</b> <span class="pill">${esc(c.unit||"Terazza")}</span><br><span class="mu">${esc(c.l)} · ${esc(c.p)}</span></span><span style="display:flex;gap:8px"><button class="btn ghost dn" data-a="dc" data-id="${c.id}">${cfCls==c.id?"Yakin hapus jadwal?":"Hapus Jadwal"}</button>${cfCls==c.id?`<button class="btn ghost" data-a="batalDc">Batal</button>`:`""`}</span></div>`).join(""):`<p class="mu">Belum ada jadwal kelas di ${esc(unitLabel())}.</p>`}</div>`};

document.addEventListener("click",async e=>{
const fb=e.target.closest("[data-fbelt]");
if(fb){fBelt=fb.dataset.fbelt;return draw();}
const b=e.target.closest("[data-a]");if(!b)return;const a=b.dataset.a,id=b.dataset.id;
if(a=="resetFilter"){fSearch="";fBelt="all";return draw();}
if(a=="add"){ed={};cf=null;cur="mur";return draw()}
if(a=="edit"){ed=S.find(s=>s.id==id);return draw()}
if(a=="cancel"){ed=null;return draw()}
if(a=="batalLulus"){cfLulus=null;return draw()}
if(a=="batalDc"){cfCls=null;return draw()}
if(a=="batalDelCoach"){cfCoach=null;return draw()}
if(a=="batalReset"){cfReset=null;return draw()}
if(a=="pickCoach"){
  coachName=b.dataset.coach||"Sabeum Shandy";
  rememberCoach(coachName);
  evSaveStatus="";
  return draw();
}
if(a=="openLog"){
  ad=b.dataset.date||ad;
  coachName=b.dataset.coach||coachName;
  rememberCoach(coachName);
  evSaveStatus="";
  draw();
  window.scrollTo({top:0,behavior:"smooth"});
  return;
}
if(a=="copyPortal"){
  const url=location.origin+"/?portal="+encodeURIComponent(id);
  try{await navigator.clipboard.writeText(url);toast("Link Portal Orang Tua disalin!")}
  catch(err){prompt("Salin link Portal Orang Tua di bawah ini:",url)}
  return;
}
if(a=="copyCoachPortal"){
  const url=location.origin+"/?pelatih=1";
  try{await navigator.clipboard.writeText(url);toast("Link Portal Pelatih disalin!")}
  catch(err){prompt("Salin link Portal Pelatih di bawah ini:",url)}
  return;
}
if(a=="copyAttRep"){
  const act=activeS(),mSes=[...A].filter(x=>x.id.startsWith(ym)).sort((a,b)=>a.id.localeCompare(b.id));
  const tot=mSes.length;
  const lines=act.map(s=>{const h=mSes.filter(x=>x.ids&&x.ids[s.id]).length;const pct=tot?Math.round(h/tot*100):0;return`• ${s._n}: ${h}/${tot} sesi (${pct}%)`});
  const txt=`📊 Laporan Absensi Supreme Taekwondo (${unitLabel()})\nBulan: ${ym} (Total ${tot} sesi)\n\n`+(lines.join("\n")||"Belum ada murid aktif.");
  try{await navigator.clipboard.writeText(txt);toast("Ringkasan absensi disalin!")}
  catch(err){prompt("Salin ringkasan absensi:",txt)}
  return;
}
if(a=="ghRun"){
  const tok=document.getElementById("ghTok").value.trim();
  const raw=document.getElementById("ghPkg").value.trim();
  const resBox=document.getElementById("ghRes");
  if(!tok)return toast("Isi GitHub Token dulu");
  if(!raw)return toast("Tempel paket update JSON dulu");
  localStorage.setItem("dojang_gh_tok",tok);
  let pkg;try{pkg=JSON.parse(raw)}catch(err){return toast("Format paket JSON tidak valid")}
  resBox.innerHTML=`<span class="pill">Mengirim ke GitHub...</span>`;
  try{
    const r=await fetch("/api/deploy",{method:"POST",headers:__hdr({"content-type":"application/json"}),body:JSON.stringify({token:tok,mode:b.dataset.mode,title:pkg.title,files:pkg.files})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||"Gagal");
    if(d.mode==="pr"){
      resBox.innerHTML=`<div class="note">✓ Pull Request berhasil dibuat! <a class="btn" style="margin-left:8px" target="_blank" rel="noopener" href="${esc(d.prUrl)}">Buka &amp; Merge PR</a></div>`;
      toast("✓ Pull Request berhasil dibuat!");
    }else{
      resBox.innerHTML=`<div class="note">✓ Berhasil di-update ke main! Tunggu ~30 detik lalu tekan Ctrl+F5.</div>`;
      toast("✓ Berhasil di-update ke main!");
    }
    document.getElementById("ghPkg").value="";
  }catch(err){resBox.innerHTML=`<span class="pill warn">Error: ${esc(err.message)}</span>`;toast("Error: "+err.message);}
  return;
}
if(!db)return toast("Masukkan PIN terlebih dahulu");
const C=n=>db.collection(n),v=i=>(document.getElementById(i)?.value||"").trim();
try{
if(a=="addUnit"){
  const rawU=v("newUnitInp");
  if(!rawU)return toast("Ketik nama unit dojang dulu");
  const feeVal=+v("newUnitFee")||RP;
  const uName=ensureUnit(rawU,feeVal);
  toast("Unit "+uName+" ("+rp(feeVal)+") ditambahkan!");
}
else if(a=="saveUnitFee"){
  const uName=b.dataset.unit;
  const feeVal=+v("ufee_"+slug(uName));
  if(!(feeVal>0))return toast("Masukkan nominal iuran yang valid");
  await C("units").doc(slug(uName)).set({name:uName,fee:feeVal,updatedAt:new Date().toISOString()});
  toast("Tarif "+uName+" diubah ke "+rp(feeVal));
}
else if(a=="save"){
  const isFoto=document.getElementById("ff").checked;
  const isCuti=document.getElementById("fc").checked;
  const uName=ensureUnit(v("fu")||"Terazza");
  const rawFee=v("ffee");
  const customFee=(rawFee!==""&&Number(rawFee)>=0)?Number(rawFee):null;
  const o={n:v("fn"),gender:v("fgender"),ortu:v("fortu"),unit:uName,fee:customFee,a:+v("fa")||0,v:2,bi:+v("fb"),wa:v("fw"),note:v("fo"),cuti:isCuti,cutiKet:v("fck"),cutiTgl:isCuti?(ed.cutiTgl||ymd()):"",foto:isFoto,fotoTgl:isFoto?(ed.fotoTgl||ymd()):"",sk:{}};
  document.querySelectorAll("[data-sk]").forEach(i=>o.sk[i.dataset.sk]=Math.min(100,+i.value||0));
  if(!o.n)return toast("Isi nama murid");
  if(ed.id)await C("students").doc(ed.id).update(o);else await C("students").add(o);
  ed=null;toast("Tersimpan");
}
else if(a=="del"){if(cf!=id){cf=id;return draw()}await C("students").doc(id).delete();cf=null;toast("Murid dihapus")}
else if(a=="seed"){for(const s of [["Alya Putri","Perempuan","Ibu Rina",9,1,88,[82,60,70,85,92]],["Raka Pratama","Laki-laki","Bpk. Doni",11,2,62,[68,74,80,55,70]],["Nadia Wijaya","Perempuan","Ibu Rina",8,0,91,[75,48,55,78,95]],["Kevin Santoso","Laki-laki","Bpk. Hendra",13,3,74,[80,82,76,66,78]]])await C("students").add({n:s[0],gender:s[1],ortu:s[2],unit:"Terazza",fee:null,a:s[3],v:2,bi:s[4],pct:s[5],sk:Object.fromEntries(SK.map((k,i)=>[k,s[6][i]])),note:"",cuti:false,cutiKet:"",cutiTgl:"",foto:true,fotoTgl:ymd(),wa:""});toast("Contoh data dimuat")}
else if(a=="lead"){if(!v("ln"))return toast("Isi nama calon murid");const uName=ensureUnit(v("lu")||"Terazza");await C("leads").add({n:v("ln"),unit:uName,a:+v("la")||0,wa:v("lw")});toast("Tercatat")}
else if(a=="conv"){const l=Lz.find(x=>x.id==id);await C("students").add({n:l.n,gender:"",ortu:"",unit:l.unit||"Terazza",fee:null,a:l.a,v:2,bi:0,pct:0,sk:{},wa:l.wa,note:"",cuti:false,cutiKet:"",cutiTgl:"",foto:false,fotoTgl:""});await C("leads").doc(id).delete();toast("Jadi murid")}
else if(a=="dl")await C("leads").doc(id).delete();
else if(a=="tanda"){const s=S.find(x=>x.id==id);await C("students").doc(id).update(s.siap?{siap:false,tolak:true}:{siap:true,tolak:false});toast(s.siap?"Tanda siap dibatalkan":"Ditandai siap ujian")}
else if(a=="lulus"){
  if(cfLulus!=id){cfLulus=id;return draw();}
  const s=S.find(x=>x.id==id);
  await C("students").doc(id).update({v:2,bi:s.bi+1,pct:0,sejak:ymd(),siap:false,tolak:false});
  cfLulus=null;
  toast("Naik ke sabuk "+s.nx);
}
else if(a=="cls"){if(!v("jh"))return toast("Isi hari kelas");const uName=ensureUnit(v("ju")||"Terazza");await C("classes").add({unit:uName,h:v("jh"),j:v("jj"),l:v("jl"),p:v("jp")});toast("Kelas tersimpan")}
else if(a=="evsave"){await saveCurrentEval(false);return;}
else if(a=="dc"){if(cfCls!=id){cfCls=id;return draw();}await C("classes").doc(id).delete();cfCls=null;toast("Jadwal kelas dihapus")}
else if(a=="delCoach"){
  const cName=b.dataset.coach||"";
  if(cfCoach!==cName){cfCoach=cName;return draw();}
  const cSlug=slug(cName);
  await C("coaches").doc(cSlug).delete();
  try{const arr=JSON.parse(localStorage.getItem("dojang_coaches")||"[]").filter(x=>slug(x)!==cSlug);localStorage.setItem("dojang_coaches",JSON.stringify(arr));}catch(err){}
  cfCoach=null;
  toast("Data pelatih dihapus");
}
else if(a=="resetCol"){
  const target=b.dataset.col;
  if(cfReset!==target){cfReset=target;return draw();}
  if(target==="students"){
    for(const s of S)await C("students").doc(s.id).delete();
    toast("Semua data murid dihapus");
  }else if(target==="coaches"){
    for(const c of CList)await C("coaches").doc(c.id).delete();
    localStorage.removeItem("dojang_coaches");
    toast("Semua data pelatih dihapus");
  }
  cfReset=null;
}
}catch(x){toast("Gagal menyimpan")}draw()});

document.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="fSearchInp"){
    fSearch=t.value;
    applyAdminFilterDOM();
    return;
  }
  if(t.id==="coachInp"){
    coachName=t.value;
    rememberCoach(coachName);
    return;
  }
  if(t.dataset.en){
    queueAutoSave();
  }
});

document.addEventListener("change",async e=>{const t=e.target;
if(t.id=="ad"){ad=t.value||ad;evSaveStatus="";return draw()}
if(t.id=="ym"){ym=t.value||ym;return draw()}
if(t.id=="coachInp"){coachName=t.value.trim()||"Sabeum Shandy";rememberCoach(coachName);evSaveStatus="";return draw()}
if(t.id=="lapSelMurid"){selId=t.value;return draw()}
if(t.dataset.ev){queueAutoSave();return;}
const att=!!t.dataset.ab,id=t.dataset.ab||t.dataset.py;if(!id)return;
if(!db)return toast("Masukkan PIN terlebih dahulu");
const key=att?ad:ym,r=(att?A:P).find(x=>x.id==key),ids={...((r&&r.ids)||{}),[id]:t.checked};
try{await db.doc((att?"attendance/":"payments/")+key).set(att?{date:key,ids}:{ids})}catch(x){toast("Gagal menyimpan")}});

(async()=>{try{const c=window.claude&&await claude.use("db");if(!c)return;db=c;
const sub=(n,f)=>db.collection(n).onSnapshot(q=>{f(q.docs.map(d=>({id:d.id,...d.data()})));const ghBusy=cur==="dat"&&((document.getElementById("ghPkg")?.value||"").trim()||(document.getElementById("ghRes")?.innerHTML||"").trim());if(!ghBusy&&!document.activeElement?.closest?.("#app input,#app textarea,#app select"))draw()},()=>toast("Data belum bisa dimuat"));
sub("students",sync);sub("attendance",x=>A=x);sub("payments",x=>P=x);sub("leads",x=>Lz=x);sub("evaluations",x=>E=x);sub("classes",x=>J=x);sub("coaches",x=>CList=x);sub("units",x=>UList=x);draw()}catch(e){}})();
draw();

const DCOL=["students","attendance","payments","leads","classes","evaluations","coaches","units"];
const dlFile=async(name,text)=>{let dl=null;try{dl=window.claude?await claude.use("downloads"):null}catch(e){}if(dl){try{await dl.save({filename:name,data:text});return}catch(e){}}const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));a.download=name;document.body.appendChild(a);a.click();a.remove()};
V.dat=()=>{const coachRows=CList.map(c=>`<div class="row"><span><b>🥋 ${esc(c.name||c.id)}</b></span><span style="display:flex;gap:8px"><button class="btn ghost dn" data-a="delCoach" data-coach="${esc(c.name||c.id)}">${cfCoach===(c.name||c.id)?"Yakin hapus pelatih?":"Hapus Pelatih"}</button>${cfCoach===(c.name||c.id)?`<button class="btn ghost" data-a="batalDelCoach">Batal</button>`:`""`}</span></div>`).join("");
const stuRows=S.map(s=>`<div class="row"><span><span class="dot" style="background:${s.c}"></span><b>${s.n}</b> <span class="pill">${esc(s.unit)}</span> <span class="mu">${s.b}</span></span><span style="display:flex;gap:8px"><button class="btn ghost dn" data-a="del" data-id="${s.id}">${cf==s.id?"Yakin hapus murid?":"Hapus Murid"}</button>${cf==s.id?`<button class="btn ghost" data-a="cancel">Batal</button>`:`""`}</span></div>`).join("");
return need()+`<div class="top"><div><h1>Data &amp; cadangan</h1><span class="mu">Simpan cadangan data ke file, pulihkan cadangan, atau kelola penghapusan data murid &amp; pelatih.</span></div></div><div class="sec"><h2>Ekspor</h2><p class="mu">Unduh semua data murid, absensi, iuran, penilaian, dan jadwal dalam satu file.</p><button class="btn" data-a="exp">Unduh cadangan (.json)</button></div><div class="sec"><h2>Impor</h2><p class="mu">Data dengan ID yang sama akan diganti. Data lain tetap ada.</p><input type="file" id="impf" accept="application/json,.json"></div><div class="sec"><h2>🗑️ Hapus Data Pelatih (${CList.length} terdaftar)</h2><p class="mu">Hapus nama pelatih yang sudah tidak aktif dari daftar cepat dan Portal Pelatih.</p>${coachRows||`<p class="mu">Belum ada data pelatih tambahan di database.</p>`}${CList.length?`<p style="margin-top:14px"><button class="btn ghost dn" data-a="resetCol" data-col="coaches">${cfReset==="coaches"?"⚠️ KLIK LAGI: Hapus SEMUA Pelatih":"Hapus Semua Data Pelatih"}</button>${cfReset==="coaches"?` <button class="btn ghost" data-a="batalReset">Batal</button>`:`""`}</p>`:`""`}</div><div class="sec"><h2>🗑️ Hapus Data Murid (${S.length} total)</h2><p class="mu">Hapus data murid satu per satu atau bersihkan seluruh data murid sekaligus.</p>${stuRows||`<p class="mu">Belum ada data murid.</p>`}${S.length?`<p style="margin-top:14px"><button class="btn ghost dn" data-a="resetCol" data-col="students">${cfReset==="students"?"⚠️ KLIK LAGI: Hapus SEMUA Murid":"Hapus Semua Data Murid"}</button>${cfReset==="students"?` <button class="btn ghost" data-a="batalReset">Batal</button>`:`""`}</p>`:`""`}</div><div class="sec"><h2>🚀 Update Aplikasi Otomatis (GitHub)</h2><p class="mu">Simpan GitHub Token sekali saja. Ke depannya cukup tempel paket update dan klik tombol di bawah tanpa buka GitHub manual.</p><label>GitHub Personal Access Token</label><input id="ghTok" type="password" placeholder="github_pat_..." value="${esc(localStorage.getItem("dojang_gh_tok")||"")}" style="margin-bottom:10px"><label>Paket Update (JSON dari Asisten)</label><textarea id="ghPkg" rows="4" placeholder='Tempel kode paket update di sini...'></textarea><div id="ghRes" style="margin-top:10px"></div><p style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px"><button class="btn" data-a="ghRun" data-mode="pr">Buat Pull Request di GitHub</button><button class="btn ghost" data-a="ghRun" data-mode="direct">Update Langsung ke Main</button></p></div>`};
document.addEventListener("click",async e=>{const b=e.target.closest('[data-a="exp"]');if(!b)return;if(!db)return toast("Belum terhubung. Tunggu halaman siap.");try{const out={exported:new Date().toISOString(),data:{}};for(const c of DCOL){const q=await db.collection(c).get();out.data[c]=q.docs.map(d=>({id:d.id,...d.data()}))}await dlFile("dojang-backup-"+ymd()+".json",JSON.stringify(out,null,2));toast("Cadangan dibuat")}catch(x){toast("Gagal membuat cadangan")}});
document.addEventListener("change",async e=>{if(e.target.id!="impf")return;const f=e.target.files[0];if(!f)return;if(!db)return toast("Belum terhubung");try{const j=JSON.parse(await f.text());const dt=j.data||{};let n=0;for(const c of DCOL){for(const r of (dt[c]||[])){const {id,...rest}=r;await db.collection(c).doc(id).set(rest);n++}}toast("Impor selesai: "+n+" data");draw()}catch(x){toast("File tidak valid")}e.target.value=""});
}
</script>
