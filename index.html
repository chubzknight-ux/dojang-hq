:root[data-theme="dark"]{--bg:#0F1220;--sf:#181C30;--ink:#EEF0F8;--mu:#9AA1B8;--ln:#2A2F48;--bl:#8AA4FF;--rd:#FF7088;--ok:#5FD39A;--tint:#222849;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}

body.standalone-portal main{margin:0 auto;max-width:880px}
h1,h2,h3{font-family:"Barlow Condensed",Impact,sans-serif;font-weight:700;margin:0;letter-spacing:.01em}
h1{font-size:34px;line-height:1.05}
h2{font-size:22px}
h3{font-size:18px}
nav{background:#0E1430;border:0;padding:22px 14px;display:flex;flex-direction:column;gap:4px;overflow-y:auto}
.brand{color:#fff;font:700 24px/1.1 "Barlow Condensed",Impact,sans-serif;padding:0 10px 24px;position:relative}
.brand-wrap{display:flex;align-items:center;gap:11px}
.brand-logo{width:48px;height:48px;border-radius:50%;background:#fff;padding:4px;box-shadow:0 3px 10px rgba(0,0,0,.3);flex-shrink:0;display:block;object-fit:contain}
.brand small{display:block;font:400 11.5px Barlow,sans-serif;color:#9AA4D0;margin-top:2px}
.brand::after{content:"";position:absolute;left:10px;bottom:10px;width:64px;height:6px;border-radius:3px;background:linear-gradient(90deg,#111 0 70%,#C8102E 70%);outline:1px solid #3A4272}
nav button{all:unset;cursor:pointer;padding:11px 12px;border-radius:10px;color:#B8C0E6;font-weight:500;display:flex;gap:10px;align-items:center}

.unit-sw{margin:4px 0 12px;padding:0 6px}

main{padding:28px 32px;max-width:1120px;width:100%;min-width:0}

:root{--bg:#EDF0F7;--sh:0 1px 2px rgba(20,24,43,.06),0 10px 28px -14px rgba(20,24,43,.25)}

.hero-logo{width:76px;height:76px;border-radius:50%;background:#fff;padding:5px;box-shadow:0 8px 22px rgba(0,0,0,.28);flex-shrink:0;display:block;object-fit:contain}

.xl{display:flex;gap:10px;font-size:12px;color:var(--mu);margin-top:6px}
.xl span{flex:1;text-align:center}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--ln);align-items:center}

.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}

.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}

.ses-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:4px 10px;border-radius:999px;background:var(--tint);color:var(--bl);font-weight:500;margin:2px}
.ses-pill button{all:unset;cursor:pointer;color:var(--rd);font-weight:700;padding:0 4px;border-radius:999px;line-height:1}

.star-btns{display:inline-flex;gap:6px}
.star-btn{all:unset;cursor:pointer;width:36px;height:36px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--mu);transition:all .15s}

.star-btn.on{background:linear-gradient(135deg,#F2B600,#E09B00);color:#14182B;border-color:#D99600;box-shadow:0 3px 10px rgba(242,182,0,.35)}

  .hero-logo{width:60px;height:60px}
  .hl h1{font-size:32px}
  .hr{padding:20px 24px 28px}
}

    return window.__LOGO_DATA__ || localStorage.getItem("dojang_logo_cache") || "";

  function applyLogoAll(){
    const u = getLogoUri();
    document.querySelectorAll("img.brand-logo,img.hero-logo,img.pin-logo").forEach(function(img){
      if(u){ img.src = u; img.style.display = "block"; }
      else { img.style.display = "none"; }

  document.documentElement.lang = lang;
  const isEN = function(){ return lang === "en"; };

    return String(s == null ? "" : s)

      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function showToast(msg){
    const el = document.getElementById("toast");
    if(!el) return;
    el.textContent = msg;
    el.classList.add("on");
    clearTimeout(showToast._t);
    showToast._t = setTimeout(function(){ el.classList.remove("on"); }, 2400);
  }

  const mkBelt = function(c, t, n){
    if(n === 1) return "linear-gradient(90deg,"+c+" 0 38%,"+t+" 38% 62%,"+c+" 62%)";
    if(n === 2) return "linear-gradient(90deg,"+c+" 0 28%,"+t+" 28% 42%,"+c+" 42% 58%,"+t+" 58% 72%,"+c+" 72%)";

  function getBeltInfo(beltId){
    return BELTS.find(function(b){ return b.id === beltId; }) || BELTS[0];

    const b = getBeltInfo(beltId);

      const parsed = JSON.parse(raw);
      const def = defaultState();
      return Object.assign({}, def, parsed, {
        students: Array.isArray(parsed.students) ? parsed.students : def.students,
        assessments: Array.isArray(parsed.assessments) ? parsed.assessments : def.assessments,
        sessions: Array.isArray(parsed.sessions) ? parsed.sessions : def.sessions,
        coaches: Array.isArray(parsed.coaches) ? parsed.coaches : def.coaches,
        units: Array.isArray(parsed.units) && parsed.units.length ? parsed.units : def.units
      });
    } catch(e){
      return defaultState();
    }
  }

  // --- SINKRONISASI PENILAIAN KELAS -> GRAFIK KETERAMPILAN ---
  // Menggabungkan skor dasar murid dengan rata-rata nilai dari Penilaian Kelas (skala 1-5 -> 60-100%)
  function getSyncedSkills(student){
    const base = Object.assign({ kibon: 75, chagi: 75, poomsae: 75, kyorugi: 75, fisik: 75 }, student.baseSkills || {});
    const stuAssessments = state.assessments.filter(function(a){ return a.studentId === student.id; });
    if(!stuAssessments.length) return base;

    const result = {};
    SKILL_DEFS.forEach(function(sk){
      let sum = 0;
      let count = 0;
      stuAssessments.forEach(function(a){
        const starVal = Number(a.scores && a.scores[sk.key]);
        if(starVal >= 1 && starVal <= 5){
          // Konversi bintang 1..5 ke persen: 1=55%, 2=68%, 3=78%, 4=88%, 5=98%
          const pct = 45 + (starVal * 10.6);
          sum += pct;
          count++;
        }
      });
      if(count > 0){
        const avgClass = sum / count;
        // Bobot 70% dari rata-rata Penilaian Kelas terbaru + 30% skor awal
        result[sk.key] = Math.min(100, Math.max(40, Math.round(avgClass * 0.7 + (base[sk.key] || 75) * 0.3)));
      } else {
        result[sk.key] = base[sk.key] || 75;
      }
    });
    return result;
  }

  function getOverallSkillAvg(student){
    const sk = getSyncedSkills(student);
    const vals = SKILL_DEFS.map(function(d){ return sk[d.key] || 0; });
    return Math.round(vals.reduce(function(a,b){ return a+b; }, 0) / vals.length);
  }

  function getAttendanceStats(studentId){
    let total = 0, hadir = 0, izin = 0, alpha = 0;
    state.sessions.forEach(function(s){
      if(s.records && s.records[studentId]){
        total++;
        const st = s.records[studentId];
        if(st === "H") hadir++;
        else if(st === "I") izin++;
        else if(st === "A") alpha++;
      }
    });
    const pct = total > 0 ? Math.round((hadir / total) * 100) : 100;
    return { total: total, hadir: hadir, izin: izin, alpha: alpha, pct: pct };
  }

  // --- TAB 3: PENILAIAN KELAS (OTOMATIS UPDATE GRAFIK KETERAMPILAN) ---
  function renderAssessment(){
    const list = filteredStudents();
    if(!list.some(function(s){ return s.id === assessDraft.studentId; }) && list[0]){
      assessDraft.studentId = list[0].id;
    }
    const targetStu = state.students.find(function(s){ return s.id === assessDraft.studentId; }) || list[0];

    let stuOpts = list.map(function(s){
      return '<option value="' + esc(s.id) + '"' + (targetStu && targetStu.id === s.id ? ' selected' : '') + '>' + esc(s.name) + ' (' + esc(beltLabel(s.belt)) + ')</option>';
    }).join("");

    let coachOpts = state.coaches.map(function(c){
      return '<option value="' + esc(c.name) + '"' + (assessDraft.coach === c.name ? ' selected' : '') + '>' + esc(c.name) + '</option>';
    }).join("");

    let starRows = "";
    SKILL_DEFS.forEach(function(d){
      const curVal = Number(assessDraft.scores[d.key]) || 4;
      let btns = "";
      for(let i = 1; i <= 5; i++){
        btns += '<button type="button" class="star-btn' + (curVal >= i ? ' on' : '') + '" data-skkey="' + d.key + '" data-skval="' + i + '">' + i + '</button>';
      }
      starRows += '<div class="star-row">' +
        '<div><strong>' + esc(isEN() ? d.en : d.id) + '</strong><div class="mu" style="font-size:12.5px">' + T("Skor sesi: " + curVal + " / 5", "Session rating: " + curVal + " / 5") + '</div></div>' +
        '<div class="star-btns">' + btns + '</div>' +
      '</div>';
    });

    // Recent assessments table
    let recentRows = "";
    const recentList = state.assessments.slice().sort(function(a,b){ return b.date.localeCompare(a.date); }).slice(0, 12);
    recentList.forEach(function(a){
      const st = state.students.find(function(x){ return x.id === a.studentId; });
      if(!st) return;
      const avg = (SKILL_DEFS.reduce(function(acc, d){ return acc + (Number(a.scores[d.key]) || 0); }, 0) / SKILL_DEFS.length).toFixed(1);
      recentRows += '<tr>' +
        '<td>' + esc(a.date) + '</td>' +
        '<td><strong>' + esc(st.name) + '</strong></td>' +
        '<td class="c">' + (a.scores.kibon || "-") + '</td>' +
        '<td class="c">' + (a.scores.chagi || "-") + '</td>' +
        '<td class="c">' + (a.scores.poomsae || "-") + '</td>' +
        '<td class="c">' + (a.scores.kyorugi || "-") + '</td>' +
        '<td class="c">' + (a.scores.fisik || "-") + '</td>' +
        '<td class="c"><span class="pill ok">★ ' + avg + '</span></td>' +
        '<td class="c"><button type="button" class="btn sm dn" data-delassess="' + esc(a.id) + '">×</button></td>' +
      '</tr>';
    });

    return '<div class="note">' +
        T("Nilai yang disimpan di <strong>Penilaian Kelas</strong> otomatis disinkronkan ke <strong>Grafik Keterampilan</strong> pada profil murid dan Portal Orang Tua.",
          "Scores saved in <strong>Class Assessment</strong> are automatically synced to the <strong>Skill Chart</strong> in student profiles and Parent Portals.") +
      '</div>' +

      '<div class="grid">' +
        '<div class="sec">' +
          '<h2>' + T("Input Penilaian Kelas", "Class Assessment Form") + '</h2>' +
          '<div class="f" style="margin-bottom:12px">' +
            '<div><label>' + T("Pilih Murid", "Select Student") + '</label><select id="asStuSel">' + stuOpts + '</select></div>' +
            '<div><label>' + T("Tanggal Latihan", "Session Date") + '</label><input type="date" id="asDateInp" value="' + esc(assessDraft.date) + '"></div>' +
            '<div><label>' + T("Pelatih Penilai", "Coach") + '</label><select id="asCoachSel">' + coachOpts + '</select></div>' +
          '</div>' +
          starRows +
          '<div style="margin-top:12px">' +
            '<label>' + T("Catatan Evaluasi Sesi", "Session Feedback") + '</label>' +
            '<input id="asCommentInp" value="' + esc(assessDraft.comment) + '" placeholder="' + T("Contoh: Power tendangan meningkat pesat...", "e.g., Kick power improved significantly...") + '">' +
          '</div>' +

            '<button type="button" class="btn" id="saveAssessBtn">' + T("Simpan & Sinkronkan ke Grafik", "Save & Sync to Skill Chart") + '</button>' +

          (targetStu ? ('<div style="margin-bottom:10px"><span class="mu">' + T("Pratinjau Live:", "Live Preview:") + '</span> <strong>' + esc(targetStu.name) + '</strong></div>' + renderSkillChartHtml(targetStu)) : '') +

        '<div class="tbl-wrap">' +
          '<table class="att-tbl">' +

          '</table>' +
        '</div>' +

  function renderAttendance(){
    const unitToUse = selectedUnit === "ALL" ? state.units[0] : selectedUnit;
    const unitSessions = state.sessions
      .filter(function(s){ return selectedUnit === "ALL" || s.unit === selectedUnit; })
      .sort(function(a,b){ return b.date.localeCompare(a.date); });

    const list = filteredStudents();

    let sesPills = unitSessions.map(function(s){
      return '<span class="ses-pill">' + esc(s.date) + ' · ' + esc(s.unit) +
        ' <button type="button" data-delses="' + esc(s.id) + '" title="Hapus sesi">×</button></span>';
    }).join("");

    let thCols = unitSessions.slice(0, 6).map(function(s){
      return '<th class="c">' + esc(s.date.slice(5)) + '</th>';
    }).join("");

    let rowsHtml = list.map(function(st){
      const att = getAttendanceStats(st.id);
      let cells = unitSessions.slice(0, 6).map(function(s){
        const val = (s.records && s.records[st.id]) || "-";
        const cls = val === "H" ? "ok" : (val === "I" ? "leave" : (val === "A" ? "warn" : ""));
        return '<td class="c"><button type="button" class="pill ' + cls + '" style="cursor:pointer;border:0" data-att-ses="' + esc(s.id) + '" data-att-stu="' + esc(st.id) + '">' + val + '</button></td>';
      }).join("");

      return '<tr>' +
        '<td><strong>' + esc(st.name) + '</strong><div class="mu" style="font-size:12px">' + esc(beltLabel(st.belt)) + '</div></td>' +
        cells +
        '<td class="c"><strong>' + att.pct + '%</strong></td>' +
      '</tr>';
    }).join("");

    let unitOpts = state.units.map(function(u){
      return '<option value="' + esc(u) + '"' + (unitToUse === u ? ' selected' : '') + '>' + esc(u) + '</option>';
    }).join("");

    return '<div class="sec">' +
        '<h2>' + T("Buat Sesi Latihan Baru", "Create New Training Session") + '</h2>' +
        '<div class="f" style="align-items:end">' +
          '<div><label>' + T("Tanggal Latihan", "Date") + '</label><input type="date" id="newSesDate" value="' + new Date().toISOString().slice(0,10) + '"></div>' +
          '<div><label>' + T("Unit / Cabang", "Unit") + '</label><select id="newSesUnit">' + unitOpts + '</select></div>' +
          '<div><button type="button" class="btn" id="addSesBtn">+ ' + T("Tambah Sesi (Default Hadir)", "Add Session (Default Present)") + '</button></div>' +
        '</div>' +
        '<div style="margin-top:12px">' + (sesPills || '<span class="mu">' + T("Belum ada sesi tercatat.", "No sessions recorded.") + '</span>') + '</div>' +
      '</div>' +

      '<div class="sec">' +
        '<h2>' + T("Tabel Presensi (Klik H / I / A untuk mengubah)", "Attendance Sheet (Click H / I / A to toggle)") + '</h2>' +
        '<div class="tbl-wrap">' +
          '<table class="att-tbl">' +
            '<thead><tr><th>' + T("Nama Murid", "Student") + '</th>' + thCols + '<th class="c">%</th></tr></thead>' +
            '<tbody>' + (rowsHtml || '<tr><td colspan="8" class="mu">' + T("Belum ada murid.", "No students.") + '</td></tr>') + '</tbody>' +
          '</table>' +
        '</div>' +
      '</div>';
  }

        '<div style="margin-bottom:10px">' + unitsHtml + '</div>' +
        '<div style="display:flex;gap:8px">' +
          '<input id="newUnitInp" placeholder="' + T("Nama cabang baru...", "New branch name...") + '">' +
          '<button type="button" class="btn sm" id="addUnitBtn">' + T("Tambah", "Add") + '</button>' +
        '</div>' +
        '<hr style="border:0;border-top:1px solid var(--ln);margin:16px 0">' +
        '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
          '<button type="button" class="btn sm ghost" id="exportJsonBtn">' + T("Ekspor Backup JSON", "Export Backup") + '</button>' +
          '<button type="button" class="btn sm dn" id="resetDemoBtn">' + T("Reset Data Default", "Reset Default Data") + '</button>' +
        '</div>' +
      '</div>' +
    '</div>';
  }

  // --- MAIN RENDER & EVENT BINDINGS ---
  function renderMain(){
    const app = document.getElementById("app");
    if(!app) return;

    let content = "";
    if(activeTab === "dashboard") content = renderDashboard();
    else if(activeTab === "students") content = renderStudents();
    else if(activeTab === "assessment") content = renderAssessment();
    else if(activeTab === "attendance") content = renderAttendance();
    else if(activeTab === "coaches") content = renderCoaches();
    else if(activeTab === "messages") content = renderMessages();
    else if(activeTab === "settings") content = renderSettings();

    app.innerHTML = '<div class="top-util">' + langPillHtml() + '</div>' + content;
    applyLogoAll();
    bindLangButtons();
    bindPageEvents();
  }

  function bindPageEvents(){
    // Dashboard jump
    document.querySelectorAll("[data-jump-stu]").forEach(function(b){
      b.onclick = function(){
        selectedStudentId = b.getAttribute("data-jump-stu");
        activeTab = "students";
        renderNav();
        renderMain();
      };
    });
    const dashGoAssess = document.getElementById("dashGoAssess");
    if(dashGoAssess) dashGoAssess.onclick = function(){ activeTab = "assessment"; renderNav(); renderMain(); };

    // Students tab events
    const stuSearch = document.getElementById("stuSearchInp");
    if(stuSearch){
      stuSearch.oninput = function(){
        filterQuery = stuSearch.value;
        renderMain();
        const reInp = document.getElementById("stuSearchInp");
        if(reInp){ reInp.focus(); reInp.setSelectionRange(reInp.value.length, reInp.value.length); }
      };
    }
    document.querySelectorAll("[data-fbelt]").forEach(function(b){
      b.onclick = function(){ filterBelt = b.getAttribute("data-fbelt"); renderMain(); };
    });
    document.querySelectorAll("[data-selstu]").forEach(function(b){
      b.onclick = function(){ selectedStudentId = b.getAttribute("data-selstu"); renderMain(); };
    });
    const copyPortalBtn = document.getElementById("copyPortalBtn");
    if(copyPortalBtn){
      copyPortalBtn.onclick = function(){
        const url = location.origin + location.pathname + "?portal=" + encodeURIComponent(selectedStudentId);
        if(navigator.clipboard) navigator.clipboard.writeText(url);
        showToast(T("Link Portal Murid disalin!", "Student Portal link copied!"));
      };
    }
    const goAssessThisBtn = document.getElementById("goAssessThisBtn");
    if(goAssessThisBtn){
      goAssessThisBtn.onclick = function(){
        assessDraft.studentId = selectedStudentId;
        activeTab = "assessment";
        renderNav();
        renderMain();
      };
    }
    const toggleUktBtn = document.getElementById("toggleUktBtn");
    if(toggleUktBtn){
      toggleUktBtn.onclick = function(){
        const st = state.students.find(function(s){ return s.id === selectedStudentId; });
        if(st){ st.readyUkt = !st.readyUkt; saveState(); renderMain(); showToast(T("Status UKT diperbarui", "UKT status updated")); }
      };
    }
    const saveNoteBtn = document.getElementById("saveNoteBtn");
    if(saveNoteBtn){
      saveNoteBtn.onclick = function(){
        const st = state.students.find(function(s){ return s.id === selectedStudentId; });
        const inp = document.getElementById("stuNoteInp");
        if(st && inp){ st.note = inp.value; saveState(); showToast(T("Catatan disimpan!", "Note saved!")); }
      };
    }
    const delStuBtn = document.getElementById("delStuBtn");
    if(delStuBtn){
      delStuBtn.onclick = function(){
        if(state.students.length <= 1){ showToast(T("Minimal sisakan 1 murid.", "Keep at least 1 student.")); return; }
        state.students = state.students.filter(function(s){ return s.id !== selectedStudentId; });
        selectedStudentId = state.students[0].id;
        saveState();
        renderNav();
        renderMain();
        showToast(T("Data murid dihapus.", "Student deleted."));
      };
    }
    const addStuBtn = document.getElementById("addStuBtn");
    if(addStuBtn){
      addStuBtn.onclick = function(){
        const name = (document.getElementById("newStuName").value || "").trim();
        if(!name){ showToast(T("Isi nama murid terlebih dahulu.", "Please enter student name.")); return; }
        const newId = "stc-" + Date.now().toString(36);
        state.students.push({
          id: newId,
          name: name,
          unit: document.getElementById("newStuUnit").value,
          belt: document.getElementById("newStuBelt").value,
          age: Number(document.getElementById("newStuAge").value) || 10,
          phone: (document.getElementById("newStuPhone").value || "").trim(),
          readyUkt: false,
          baseSkills: { kibon: 75, chagi: 75, poomsae: 75, kyorugi: 75, fisik: 75 },
          note: ""
        });
        selectedStudentId = newId;
        saveState();
        renderNav();
        renderMain();
        showToast(T("Murid baru berhasil ditambahkan!", "New student added!"));
      };
    }

    // Assessment tab events (Sinkron ke Grafik Keterampilan)
    const asStuSel = document.getElementById("asStuSel");
    if(asStuSel) asStuSel.onchange = function(){ assessDraft.studentId = asStuSel.value; renderMain(); };
    const asDateInp = document.getElementById("asDateInp");
    if(asDateInp) asDateInp.onchange = function(){ assessDraft.date = asDateInp.value; };
    const asCoachSel = document.getElementById("asCoachSel");
    if(asCoachSel) asCoachSel.onchange = function(){ assessDraft.coach = asCoachSel.value; };
    const asCommentInp = document.getElementById("asCommentInp");
    if(asCommentInp) asCommentInp.oninput = function(){ assessDraft.comment = asCommentInp.value; };

    document.querySelectorAll("[data-skkey]").forEach(function(btn){
      btn.onclick = function(){
        const k = btn.getAttribute("data-skkey");
        const v = Number(btn.getAttribute("data-skval"));
        assessDraft.scores[k] = v;
        renderMain();
      };
    });

    const saveAssessBtn = document.getElementById("saveAssessBtn");
    if(saveAssessBtn){
      saveAssessBtn.onclick = function(){
        if(!assessDraft.studentId) return;
        state.assessments.push({
          id: "as-" + Date.now().toString(36),
          studentId: assessDraft.studentId,
          date: assessDraft.date || new Date().toISOString().slice(0,10),
          coach: assessDraft.coach || "Sabeum",
          scores: Object.assign({}, assessDraft.scores),
          comment: (assessDraft.comment || "").trim()
        });
        assessDraft.comment = "";
        saveState();
        renderMain();
        showToast(T("Penilaian disimpan & Grafik Keterampilan diperbarui!", "Saved & Skill Chart synced!"));
      };
    }

    document.querySelectorAll("[data-delassess]").forEach(function(btn){
      btn.onclick = function(){
        const id = btn.getAttribute("data-delassess");
        state.assessments = state.assessments.filter(function(a){ return a.id !== id; });
        saveState();
        renderMain();
        showToast(T("Penilaian dihapus & grafik diperbarui.", "Assessment deleted & chart updated."));
      };
    });

    // Attendance tab events
    const addSesBtn = document.getElementById("addSesBtn");
    if(addSesBtn){
      addSesBtn.onclick = function(){
        const date = document.getElementById("newSesDate").value || new Date().toISOString().slice(0,10);
        const unit = document.getElementById("newSesUnit").value;
        const recs = {};
        state.students.filter(function(s){ return s.unit === unit; }).forEach(function(s){ recs[s.id] = "H"; });
        state.sessions.push({ id: "ses-" + Date.now().toString(36), date: date, unit: unit, records: recs });
        saveState();
        renderMain();
        showToast(T("Sesi latihan ditambahkan!", "Training session added!"));
      };
    }
    document.querySelectorAll("[data-delses]").forEach(function(b){
      b.onclick = function(){
        const id = b.getAttribute("data-delses");
        state.sessions = state.sessions.filter(function(s){ return s.id !== id; });
        saveState();
        renderMain();
      };
    });
    document.querySelectorAll("[data-att-ses]").forEach(function(b){
      b.onclick = function(){
        const sid = b.getAttribute("data-att-ses");
        const stid = b.getAttribute("data-att-stu");
        const ses = state.sessions.find(function(s){ return s.id === sid; });
        if(!ses) return;
        if(!ses.records) ses.records = {};
        const order = ["H", "I", "A", "-"];
        const cur = ses.records[stid] || "-";
        const next = order[(order.indexOf(cur) + 1) % order.length];
        if(next === "-") delete ses.records[stid];
        else ses.records[stid] = next;
        saveState();
        renderMain();
      };
    });

    // Coaches tab events
    document.querySelectorAll("[data-crating]").forEach(function(b){
      b.onclick = function(){
        const cid = b.getAttribute("data-crating");
        const val = Number(b.getAttribute("data-cval"));
        const c = state.coaches.find(function(x){ return x.id === cid; });
        if(c){ c.rating = val; saveState(); renderMain(); showToast(T("Rating pelatih diperbarui", "Coach rating updated")); }
      };
    });
    const addCoachBtn = document.getElementById("addCoachBtn");
    if(addCoachBtn){
      addCoachBtn.onclick = function(){
        const name = (document.getElementById("newCoachName").value || "").trim();
        if(!name) return;
        state.coaches.push({
          id: "c-" + Date.now().toString(36),
          name: name,
          dan: document.getElementById("newCoachDan").value || "DAN I",
          role: document.getElementById("newCoachRole").value || "Pelatih",
          unit: state.units[0],
          rating: 5,
          notes: ""
        });
        saveState();
        renderMain();
        showToast(T("Pelatih ditambahkan!", "Coach added!"));
      };
    }

    // WA messages tab events
    document.querySelectorAll("[data-watype]").forEach(function(b){
      b.onclick = function(){ waTemplateType = b.getAttribute("data-watype"); renderMain(); };
    });
    const waStuSel = document.getElementById("waStuSel");
    if(waStuSel) waStuSel.onchange = function(){ waStudentId = waStuSel.value; renderMain(); };
    const copyWaBtn = document.getElementById("copyWaBtn");
    if(copyWaBtn){
      copyWaBtn.onclick = function(){
        const txt = buildWaPreview();
        if(navigator.clipboard) navigator.clipboard.writeText(txt);
        showToast(T("Teks laporan WhatsApp disalin!", "WhatsApp report copied!"));
      };
    }

    // Settings tab events
    const saveSetBtn = document.getElementById("saveSetBtn");
    if(saveSetBtn){
      saveSetBtn.onclick = function(){
        state.clubName = document.getElementById("setClubName").value.trim() || "Supreme Taekwondo Club";
        state.nextEvent.titleId = document.getElementById("setEvId").value.trim();
        state.nextEvent.titleEn = document.getElementById("setEvEn").value.trim();
        state.nextEvent.dateStr = document.getElementById("setEvDate").value.trim();
        state.nextEvent.loc = document.getElementById("setEvLoc").value.trim();
        state.pin = document.getElementById("setPin").value.trim();
        saveState();
        renderMain();
        showToast(T("Pengaturan berhasil disimpan!", "Settings saved!"));
      };
    }
    const logoFileInp = document.getElementById("logoFileInp");
    if(logoFileInp){
      logoFileInp.onchange = function(e){
        const file = e.target.files && e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = function(){
          try {
            localStorage.setItem("dojang_logo_cache", reader.result);
            applyLogoAll();
            renderMain();
            showToast(T("Logo klub diperbarui!", "Club logo updated!"));
          } catch(err){
            showToast(T("Ukuran file logo terlalu besar.", "Logo file too large."));
          }
        };
        reader.readAsDataURL(file);
      };
    }
    const clearLogoBtn = document.getElementById("clearLogoBtn");
    if(clearLogoBtn){
      clearLogoBtn.onclick = function(){
        localStorage.removeItem("dojang_logo_cache");
        window.__LOGO_DATA__ = "";
        applyLogoAll();
        renderMain();
      };
    }
    const addUnitBtn = document.getElementById("addUnitBtn");
    if(addUnitBtn){
      addUnitBtn.onclick = function(){
        const u = (document.getElementById("newUnitInp").value || "").trim();
        if(u && state.units.indexOf(u) === -1){
          state.units.push(u);
          saveState();
          renderNav();
          renderMain();
        }
      };
    }
    document.querySelectorAll("[data-delunit]").forEach(function(b){
      b.onclick = function(){
        const idx = Number(b.getAttribute("data-delunit"));
        state.units.splice(idx, 1);
        saveState();
        renderNav();
        renderMain();
      };
    });
    const exportJsonBtn = document.getElementById("exportJsonBtn");
    if(exportJsonBtn){
      exportJsonBtn.onclick = function(){
        const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "dojang-hq-backup-" + new Date().toISOString().slice(0,10) + ".json";
        a.click();
      };
    }
    const resetDemoBtn = document.getElementById("resetDemoBtn");
    if(resetDemoBtn){
      resetDemoBtn.onclick = function(){
        state = defaultState();
        saveState();
        renderNav();
        renderMain();
        showToast(T("Data dikembalikan ke default.", "Data reset to default."));
      };
    }
  }

  // --- PIN GATE & INITIALIZATION ---
  function renderAll(){
    if(portalId){
      renderStudentPortal();
      return;
    }
    renderNav();
    renderMain();
  }

  function initApp(){
    applyLogoAll();
    if(portalId){
      renderStudentPortal();
      return;
    }
    const unlocked = sessionStorage.getItem("dojang_pin_ok") === "1";
    if(state.pin && !unlocked){
      const gate = document.getElementById("pinGate");
      const pinInp = document.getElementById("pinInp");
      const pinBtn = document.getElementById("pinBtn");
      const pinErr = document.getElementById("pinErr");
      gate.style.display = "flex";
      bindLangButtons();
      const tryUnlock = function(){
        if(pinInp.value === state.pin){
          sessionStorage.setItem("dojang_pin_ok", "1");
          gate.style.display = "none";
          renderAll();
        } else {
          pinErr.style.display = "block";
        }
      };
      pinBtn.onclick = tryUnlock;
      pinInp.onkeydown = function(e){ if(e.key === "Enter") tryUnlock(); };
    } else {
      renderAll();
    }
  }

  initApp();
})();
</script>
</body>
</html>
