  document.addEventListener("input",e=>{const t=e.target;if(t.id==="ghPkg"){const hint=document.getElementById("ghFmt");if(!hint)return;const val=t.value.trim();if(!val){hint.innerHTML="";return;}try{const p=parseUpdatePayload(val,document.getElementById("ghTitle")?.value);const kb=(p.files.reduce((s,f)=>s+f.content.length,0)/1024).toFixed(1);hint.innerHTML=`<span class="pill ok">✓ ${esc(p.modeLabel)} · ${kb} KB</span>`;}catch(err){hint.innerHTML=`<span class="pill warn">⚠️ ${esc(err.message)}</span>`;}return;}if(t.id==="fSearchInp"){fSearch=t.value;applyAdminFilterDOM();return;}if(t.id==="coachInp"){coachName=t.value;rememberCoach(coachName);return;}if(t.dataset.en){queueAutoSave();}});

  V.dat=()=>{const coachRows=CList.map(c=>`<div class="row"><span><b>🥋 ${esc(c.name||c.id)}</b></span><span style="display:flex;gap:8px"><button class="btn ghost dn" data-a="delCoach" data-coach="${esc(c.name||c.id)}">${cfCoach===(c.name||c.id)?T("Yakin hapus pelatih?","Confirm delete coach?"):T("Hapus Pelatih","Delete Coach")}</button>${cfCoach===(c.name||c.id)?`<button class="btn ghost" data-a="batalDelCoach">${T("Batal","Cancel")}</button>`:`""`}</span></div>`).join("");const stuRows=S.map(s=>`<div class="row"><span><span class="dot" style="background:${s.c}"></span><b>${s.n}</b> <span class="pill">${esc(s.unit)}</span> <span class="mu">${s.b}</span></span><span style="display:flex;gap:8px"><button class="btn ghost dn" data-a="del" data-id="${s.id}">${cf==s.id?T("Yakin hapus murid?","Confirm delete student?"):T("Hapus Murid","Delete Student")}</button>${cf==s.id?`<button class="btn ghost" data-a="cancel">${T("Batal","Cancel")}</button>`:`""`}</span></div>`).join("");return need()+`<div class="top"><div><h1>${T("Data & cadangan","Data & Backup")}</h1><span class="mu">${T("Simpan cadangan data ke file, pulihkan cadangan, atau kelola penghapusan data murid & pelatih.","Back up data to a file, restore backups, or manage student & coach record deletion.")}</span></div></div><div class="sec"><h2>${T("Ekspor","Export")}</h2><p class="mu">${T("Unduh semua data murid, absensi, iuran, penilaian, dan jadwal dalam satu file.","Download all students, attendance, tuition, evaluations, and schedules in one file.")}</p><button class="btn" data-a="exp">${T("Unduh cadangan (.json)","Download backup (.json)")}</button></div><div class="sec"><h2>${T("Impor","Import")}</h2><p class="mu">${T("Data dengan ID yang sama akan diganti. Data lain tetap ada.","Records with matching IDs will be replaced. Other records remain intact.")}</p><input type="file" id="impf" accept="application/json,.json"></div><div class="sec"><h2>🗑️ ${T("Hapus Data Pelatih","Delete Coach Records")} (${CList.length} ${T("terdaftar","registered")})</h2><p class="mu">${T("Hapus nama pelatih yang sudah tidak aktif dari daftar cepat dan Portal Pelatih.","Remove inactive coaches from quick-select and the Coach Portal.")}</p>${coachRows||`<p class="mu">${T("Belum ada data pelatih tambahan di database.","No additional coach records in database.")}</p>`}${CList.length?`<p style="margin-top:14px"><button class="btn ghost dn" data-a="resetCol" data-col="coaches">${cfReset==="coaches"?T("⚠️ KLIK LAGI: Hapus SEMUA Pelatih","⚠️ CLICK AGAIN: Delete ALL Coaches"):T("Hapus Semua Data Pelatih","Delete All Coach Records")}</button>${cfReset==="coaches"?` <button class="btn ghost" data-a="batalReset">${T("Batal","Cancel")}</button>`:`""`}</p>`:`""`}</div><div class="sec"><h2>🗑️ ${T("Hapus Data Murid","Delete Student Records")} (${S.length} total)</h2><p class="mu">${T("Hapus data murid satu per satu atau bersihkan seluruh data murid sekaligus.","Delete student records individually or clear all student records at once.")}</p>${stuRows||`<p class="mu">${T("Belum ada data murid.","No student data yet.")}</p>`}${S.length?`<p style="margin-top:14px"><button class="btn ghost dn" data-a="resetCol" data-col="students">${cfReset==="students"?T("⚠️ KLIK LAGI: Hapus SEMUA Murid","⚠️ CLICK AGAIN: Delete ALL Students"):T("Hapus Semua Data Murid","Delete All Student Records")}</button>${cfReset==="students"?` <button class="btn ghost" data-a="batalReset">${T("Batal","Cancel")}</button>`:`""`}</p>`:`""`}</div>`;};
