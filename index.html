function radar(sk){
  const safeSk={};
  const rawKeys=Object.keys(sk||{});
  const k=rawKeys.length>=3?rawKeys:SK;
  k.forEach(x=>{const v=Number((sk||{})[x]);safeSk[x]=Number.isFinite(v)?Math.max(0,Math.min(100,v)):50;});
  const c=110,r=78;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/k.length;return[(c+Math.cos(a)*r*v/100).toFixed(1),(c+Math.sin(a)*r*v/100).toFixed(1)]};
  const poly=v=>k.map((_,i)=>pt(i,v).join(",")).join(" ");
  const own=k.map((x,i)=>pt(i,safeSk[x]).join(",")).join(" ");
  const lb=k.map((x,i)=>{const[p,q]=pt(i,122);return`<text x="${p}" y="${q}" text-anchor="middle" font-size="12" fill="var(--mu)">${esc(skLabel(x))}</text>`}).join("");
  return`<svg viewBox="0 0 220 220" width="100%" style="max-width:300px" role="img" aria-label="${T("Grafik keterampilan","Skill chart")}: ${k.map(x=>skLabel(x)+" "+safeSk[x]).join(", ")}"><polygon points="${poly(100)}" fill="none" stroke="var(--ln)"/><polygon points="${poly(50)}" fill="none" stroke="var(--ln)"/><polygon points="${own}" fill="var(--bl)" fill-opacity=".25" stroke="var(--bl)" stroke-width="2"/>${lb}</svg>`;
}

const isParentCoachEvalDoc=x=>Boolean(x&&(x.type==="coach_eval"||String(x.id||"").startsWith("coach_eval__")));

function readEvalFieldScore(evObj,fieldDef){
  if(!evObj||typeof evObj!=="object")return null;
  const vDirect=Number(evObj[fieldDef.key]);
  if(Number.isFinite(vDirect)&&vDirect>=1&&vDirect<=5)return vDirect;
  const vLegacy=Number(evObj[fieldDef.legacy]);
  if(Number.isFinite(vLegacy)&&vLegacy>=1&&vLegacy<=5)return vLegacy;
  return null;
}

function getAllEvalScoresFromEntry(evObj){
  if(!evObj||typeof evObj!=="object")return[];
  const out=[];
  SK_EVAL_FIELDS.forEach(f=>{const v=readEvalFieldScore(evObj,f);if(v!==null)out.push(v);});
  return out;
}

function formatEvalEntryScores(evObj){
  if(!evObj||typeof evObj!=="object")return"";
  const hasNew=SK_EVAL_FIELDS.some(f=>Number.isFinite(Number(evObj[f.key]))&&Number(evObj[f.key])>=1);
  if(hasNew){
    return SK_EVAL_FIELDS.map(f=>`${isEN()?f.shortEn:f.shortId}:${evObj[f.key]||"–"}`).join(" · ");
  }
  return `T:${evObj.t||"–"} · ${isEN()?"A":"S"}:${evObj.k||"–"} · ${isEN()?"P":"F"}:${evObj.f||"–"}`;
}

function computeStudentSkills(rawSk,evalItems){
  const base={...(rawSk&&typeof rawSk==="object"?rawSk:{})};
  const valid=(Array.isArray(evalItems)?evalItems:[]).filter(x=>x&&typeof x==="object"&&!isParentCoachEvalDoc(x));
  const out={};
  SK_EVAL_FIELDS.forEach(f=>{
    const vals=valid.map(x=>readEvalFieldScore(x,f)).filter(v=>v!==null);
    const evVal=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length)*20:null;
    const manual=Number(base[f.skill]);
    const hasManual=Number.isFinite(manual)&&manual!==50;
    let val=50;
    if(evVal!==null){
      val=hasManual?Math.round(manual*0.3+evVal*0.7):Math.round(evVal);
    }else if(Number.isFinite(manual)){
      val=Math.round(manual);
    }
    out[f.skill]=Math.max(0,Math.min(100,val));
  });
  return out;
}

function mergeCoachListFromPublic(data){
  const m=new Map();
  const put=(rawName,extra={})=>{
    const clean=String(rawName||"").trim();
    if(!clean)return;
    const key=slug(clean);
    const prev=m.get(key)||{id:key,name:clean,gender:"",wa:"",dan:"DAN 1 Kukkiwon",unit:"Terazza",bio:""};
    m.set(key,{...prev,...extra,id:extra.id||prev.id||key,name:extra.name||prev.name||clean});
  };
  put("Sabeum Shandy",{dan:"DAN 3 Kukkiwon",unit:"Semua Unit"});
  put("Master Juwono",{dan:"DAN 5 Kukkiwon",unit:"Semua Unit"});
  (data.coaches||[]).forEach(c=>put(c.name||c.id,c));
  (data.classes||[]).forEach(c=>String(c.p||"").split(",").forEach(p=>put(p)));
  (data.evaluations||[]).filter(x=>!isParentCoachEvalDoc(x)).forEach(e=>put(e.coach));
  return [...m.values()].sort((a,b)=>String(a.name).localeCompare(String(b.name),"id"));
}

function calcPublicCoachAggregate(cRec,allEvals){
  const key=cRec.id,nSlug=slug(cRec.name);
  const pReviews=(allEvals||[]).filter(x=>isParentCoachEvalDoc(x)&&(x.targetCoachId===key||slug(x.targetCoachName||"")===nSlug)).sort((a,b)=>String(b.updatedAt||b.date||a.id||"").localeCompare(String(a.updatedAt||a.date||a.id||"")));
  const rs=cRec.ratingSummary||{};
  const adminSessions=Number(rs.sessions)||0;
  const keys=[["m","Mengajar"],["t","Teknik"],["k","Komunikasi"],["d","Disiplin"],["w","Ketepatan"]];
  const sk={};
  let sumAll=0,cntAll=0;
  keys.forEach(([k,label])=>{
    const pVals=pReviews.map(r=>Number((r.ratings||{})[k])).filter(v=>v>=1&&v<=5).map(v=>v*20);
    const hasAdmin=adminSessions>0&&Number(rs[label])>0;
    const totWeight=(hasAdmin?adminSessions:0)+pVals.length;
    if(totWeight>0){
      const weightedSum=(hasAdmin?Number(rs[label])*adminSessions:0)+pVals.reduce((a,b)=>a+b,0);
      sk[label]=Math.round(weightedSum/totWeight);
      sumAll+=sk[label];
      cntAll++;
    }else{
      sk[label]=0;
    }
  });
  const totalEvalCount=adminSessions+pReviews.length;
  const pct=cntAll?Math.round(sumAll/cntAll):0;
  const avg5=cntAll?(pct/20).toFixed(1):"–";
  const lastNote=(pReviews.find(r=>r.comment)?.comment)||rs.lastNote||"";
  return{sk,pct,avg5,totalEvalCount,adminSessions,parentCount:pReviews.length,pReviews,lastNote};
}

 Directly to Main.")}</p><div style="margin-bottom:12px"><label>GitHub Personal Access Token</label><input id="ghTok" type="password" placeholder="ghp_... / github_pat_..." value="${esc(upTok)}"></div><div style="margin-bottom:12px"><label>${T("Judul Update (opsional)","Update Title (optional)")}</label><input id="upTitle" type="text" placeholder="${T("Contoh: Sinkronisasi Iuran Portal Orang Tua","Example: Parent Portal Tuition Sync")}"></div><div><label>${T("Tempel Kode Update (HTML / Multi-File / JSON)","Paste Update Code (HTML / Multi-File / JSON)")}</label><textarea id="upPkg" rows="8" placeholder="<!DOCTYPE html> ..."></textarea></div><div id="upDetect" class="mu" style="font-size:13px;margin-top:8px"></div><p style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-a="deployDirect">🚀 ${T("Update Langsung ke Main","Update Directly to Main")}</button><button class="btn ghost" data-a="deployPR">${T("Buat Pull Request (PR)","Create Pull Request (PR)")}</button><button class="btn ghost" data-a="saveTok">${T("Simpan Token","Save Token")}</button></p><div id="upRes" style="margin-top:12px"></div></div>`;
    }
  };
  function updateDetectBadge(){const det=document.getElementById("upDetect");const pkgEl=document.getElementById("upPkg");if(!det||!pkgEl)return;const v=pkgEl.value.trim();if(!v){det.innerHTML="";return;}try{const p=parseUpdatePayload(v);det.innerHTML=`<span class="pill ok">✓ ${T("Terdeteksi:","Detected:")} ${esc(p.modeLabel)} (${esc(p.files.map(f=>f.path).join(", "))})</span>`;}catch(err){det.innerHTML=`<span class="pill warn">${T("Format belum lengkap:","Incomplete format:")} ${esc(err.message)}</span>`;}}
  const navItems=()=>[["dash",T("Ringkasan","Overview")],["murid",T("Data Murid","Students")],["hadir",T("Absensi","Attendance")],["nilai",T("Penilaian","Evaluations")],["iuran",T("Iuran Bulanan","Tuition")],["jadwal",T("Jadwal & Unit","Schedule & Units")],["pelatih",T("Pelatih & Evaluasi","Coaches & Eval")],["lap",T("Laporan Murid","Student Reports")],["upd","Update App"]];
  function render(){

    $("#app").innerHTML=(V[cur]||V.dash)();

  const ym=ymd().slice(0,7);
  document.addEventListener("change",async e=>{
    const t=e.target;
    if(t.id=="unitSel"){curUnit=t.value;localStorage.setItem("dojang_unit",curUnit);render();return;}
    if(t.id=="ad"){AD=t.value;render();return;}
    if(t.id=="ym"){YM=t.value;render();return;}
    if(t.id=="ed"){AE=t.value;render();return;}
    if(t.dataset.p){
      const sid=t.dataset.p;
      const checked=t.checked;
      const doc=P.find(x=>x.id==YM)||{id:YM,ids:{}};
      const ids={...(doc.ids||{})};
      if(checked)ids[sid]=true;else delete ids[sid];
      if(!P.some(x=>x.id==YM))P.push({id:YM,ids});else P.find(x=>x.id==YM).ids=ids;
      render();
      await db.collection("payments").doc(YM).set({month:YM,ids});
      toast(checked?T("✓ Ditandai lunas & tersimpan","✓ Marked paid & saved"):T("Status lunas dibatalkan","Marked unpaid"));
      return;
    }
    if(t.dataset.ev){U[AE]=U[AE]||{};U[AE][t.dataset.ev]={...(U[AE][t.dataset.ev]||{}),[t.dataset.k]:+t.value}}
    if(t.id=="logoFileInp"&&t.files&&t.files[0]){
      const f=t.files[0];
      const reader=new FileReader();
      reader.onload=ev=>{
        const img=new Image();
        img.onload=()=>{
          const max=256;
          let w=img.width,h=img.height;
          if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
          const cv=document.createElement("canvas");
          cv.width=w;cv.height=h;
          cv.getContext("2d").drawImage(img,0,0,w,h);
          pendingLogoUri=cv.toDataURL("image/png");
          window.__LOGO_DATA__=pendingLogoUri;
          localStorage.setItem("dojang_logo_cache",pendingLogoUri);
          applyLogoAll();
          render();
          toast(T("Preview logo siap. Klik 'Simpan & Terapkan Logo'.","Logo preview ready. Click 'Save & Apply Logo'."));
        };
        img.src=ev.target.result;
      };
      reader.readAsDataURL(f);
    }
  });
  document.addEventListener("input",e=>{
    const t=e.target;
    if(t.id=="attSearchInp"){attSearch=t.value;render();const inp=$("#attSearchInp");if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}return;}
    if(t.id=="mSearchInp"){muridSearch=t.value;render();const inp=$("#mSearchInp");if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}return;}
    if(t.id=="coachSearchInp"){coachSearch=t.value;render();const inp=$("#coachSearchInp");if(inp){inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length)}return;}
    if(t.id=="upPkg"){updateDetectBadge();return;}
    if(t.dataset.en){U[AE]=U[AE]||{};U[AE][t.dataset.en]={...(U[AE][t.dataset.en]||{}),n:t.value}}
  });
  document.addEventListener("submit",async e=>{
    e.preventDefault();
    const fd=new FormData(e.target);
    if(e.target.id=="fm"){
      const id=fd.get("id"),bi=+fd.get("bi"),bl=getBL();
      const uName=ensureUnit(fd.get("unit"));
      const rawFee=String(fd.get("fee")||"").trim();
      const customFee=rawFee!==""&&Number(rawFee)>=0?Number(rawFee):null;
      const o={v:2,n:String(fd.get("n")||"").trim(),gender:String(fd.get("gender")||"").trim(),a:+fd.get("a")||0,unit:uName,fee:customFee,bi,b:bl[bi][0],c:bl[bi][1],sejak:fd.get("sejak")||ymd(),ortu:String(fd.get("ortu")||"").trim(),wa:String(fd.get("wa")||"").trim(),note:String(fd.get("note")||"").trim(),siap:!!fd.get("siap"),cuti:!!fd.get("cuti"),cutiTgl:fd.get("cuti")?(String(fd.get("cutiTgl")||"").trim()||ymd()):"",cutiKet:fd.get("cuti")?String(fd.get("cutiKet")||"").trim():""};
      if(id)await db.collection("students").doc(id).update(o);
      else{o.sk={Poomsae:50,Kyorugi:50,Kekuatan:50,Kelenturan:50,Disiplin:50};await db.collection("students").add(o)}
      ED=null;render();toast(id?T("Perubahan murid disimpan","Student updated"):T("Murid baru ditambahkan","Student added"));
    }
    if(e.target.id=="fu"){
      const uName=String(fd.get("uname")||"").trim();
      const uFee=Math.max(0,Number(fd.get("ufee"))||RP);
      if(!uName)return;
      const savedName=ensureUnit(uName,uFee);
      curUnit=savedName;
      localStorage.setItem("dojang_unit",curUnit);
      render();toast(T("Unit ","Unit ")+savedName+" ("+rp(uFee)+"/bln) "+T("disimpan","saved"));
    }
    if(e.target.id=="fc"){
      const id=fd.get("id");
      const uName=ensureUnit(fd.get("unit"));
      const o={unit:uName,h:String(fd.get("h")||"").trim(),j:String(fd.get("j")||"").trim(),l:String(fd.get("l")||"").trim(),p:String(fd.get("p")||"").trim()||"Sabeum Shandy"};
      if(id)await db.collection("classes").doc(id).update(o);
      else await db.collection("classes").add(o);
      EC=null;render();toast(id?T("Jadwal diubah","Schedule updated"):T("Jadwal ditambahkan","Schedule added"));
    }
    if(e.target.id=="fcoach"){
      const cName=String(fd.get("name")||"").trim();
      if(!cName)return;
      const cid=String(fd.get("id")||"").trim()||slug(cName);
      const o={name:cName,gender:String(fd.get("gender")||"").trim(),wa:String(fd.get("wa")||"").trim(),dan:String(fd.get("dan")||"DAN 1 Kukkiwon").trim(),unit:String(fd.get("unit")||"Semua Unit").trim(),bio:String(fd.get("bio")||"").trim(),updatedAt:new Date().toISOString()};
      await db.collection("coaches").doc(cid).set(o);
      ED=null;render();toast(T("Data pelatih berhasil disimpan","Coach profile saved"));
    }
  });
  document.addEventListener("click",async e=>{
    const lb=e.target.closest("[data-setlang]");if(lb){lang=lb.dataset.setlang;localStorage.setItem("dojang_lang",lang);document.documentElement.lang=lang;if(document.getElementById("pinGate")?.style.display==="flex")syncPinTexts();else render();return;}
    const ab=e.target.closest("[data-abelt]");if(ab){attBelt=ab.dataset.abelt;render();return;}
    const mb=e.target.closest("[data-mbelt]");if(mb){muridBelt=mb.dataset.mbelt;render();return;}
    const cf=e.target.closest("[data-cfilter]");if(cf){coachFilter=cf.dataset.cfilter;render();return;}
    const b=e.target.closest("[data-v],[data-a]");if(!b)return;
    if(b.dataset.v){cur=b.dataset.v;ED=null;EC=null;render();return}
    const a=b.dataset.a;
    if(a=="go"){selId=b.dataset.id;cur="lap";render()}
    if(a=="m"){selId=b.dataset.id;render()}
    if(a=="salin"){const pv=document.getElementById("waPv");navigator.clipboard?.writeText(pv?pv.textContent:"");toast(T("Teks WhatsApp & link portal disalin","WhatsApp text & portal link copied"))}
    if(a=="copyPortal"){const url=location.origin+"/?portal="+encodeURIComponent(b.dataset.id);navigator.clipboard?.writeText(url);toast(T("Link Portal Orang Tua disalin!","Parent Portal link copied!"))}
    if(a=="copyCoachLink"){const url=location.origin+"/?pelatih";navigator.clipboard?.writeText(url);toast(T("Link Portal Penilaian Pelatih disalin!","Coach Evaluation Portal link copied!"))}
    if(a=="copyPubCoach"){const url=location.origin+"/?profil_pelatih="+encodeURIComponent(b.dataset.cid||"sabeum-shandy");navigator.clipboard?.writeText(url);toast(T("Link Profil & Evaluasi Pelatih disalin!","Coach Profile & Evaluation link copied!"))}
    if(a=="pickUnit"){curUnit=b.dataset.u;localStorage.setItem("dojang_unit",curUnit);render()}
    if(a=="saveUnitFee"){const uName=b.dataset.u;const inp=document.querySelector('[data-ufee-inp="'+uName+'"]');const nextFee=Math.max(0,Number(inp?.value)||0);await db.collection("units").doc(slug(uName)).set({name:uName,fee:nextFee,updatedAt:new Date().toISOString()});toast(T("Tarif ","Rate for ")+uName+" "+T("diperbarui ke ","updated to ")+rp(nextFee)+"/bln")}
    if(a=="resetAttFilter"){attSearch="";attBelt="all";render()}
    if(a=="resetMuridFilter"){muridSearch="";muridBelt="all";render()}
    if(a=="resetCoachFilter"){coachSearch="";coachFilter="all";render()}
    if(a=="edit"){ED=b.dataset.id;render();window.scrollTo({top:0,behavior:"smooth"})}
    if(a=="batal"){ED=null;render()}
    if(a=="del"){await db.collection("students").doc(b.dataset.id).delete();toast(T("Murid dihapus","Student deleted"))}
    if(a=="editCoach"){ED="coach:"+b.dataset.id;render();window.scrollTo({top:0,behavior:"smooth"})}
    if(a=="batalCoach"){ED=null;render()}
    if(a=="delCoach"){await db.collection("coaches").doc(b.dataset.id).delete();toast(T("Profil pelatih dihapus","Coach profile deleted"))}
    if(a=="editC"){EC=b.dataset.id;render();window.scrollTo({top:0,behavior:"smooth"})}
    if(a=="batalC"){EC=null;render()}
    if(a=="delC"){await db.collection("classes").doc(b.dataset.id).delete();toast(T("Jadwal dihapus","Schedule deleted"))}
    if(a=="pilihSesi"){AD=b.dataset.d;render()}
    if(a=="hapusSesi"){const d=b.dataset.d;await db.collection("attendance").doc(d).delete();if(AD===d)AD=ymd();toast(T("Sesi ","Session ")+d+" "+T("dihapus","deleted"))}
    if(a=="hadirSemua"){document.querySelectorAll("[data-h]").forEach(x=>x.checked=true);toast(T("Semua murid aktif ditandai hadir — klik Simpan absensi","All active students marked present — click Save attendance"))}
    if(a=="simpanH"){const ids={};const existing=(A.find(x=>x.id==AD)||{}).ids||{};if(curUnit!=="all")Object.assign(ids,existing);document.querySelectorAll("[data-h]").forEach(x=>{if(x.checked)ids[x.dataset.h]=true;else delete ids[x.dataset.h]});await db.collection("attendance").doc(AD).set({ids});toast(T("Absensi ","Attendance for ")+AD+" "+T("tersimpan","saved"))}
    if(a=="sesi"){AE=b.dataset.id;render()}
    if(a=="simpanE"){const existing=E.find(x=>x.id==AE);const dStr=($("#ed")||{}).value||ymd();const docId=existing?existing.id:dStr;const coachName=(existing&&existing.coach)||"Sabeum Shandy";const ev={...((existing&&existing.ev)||{})};activeS().forEach(s=>{const r={};document.querySelectorAll('[data-ev="'+s.id+'"]').forEach(x=>{if(x.value)r[x.dataset.k]=+x.value});const n=((document.querySelector('[data-en="'+s.id+'"]')||{}).value||"").trim();if(Object.keys(r).length||n)ev[s.id]={...r,n};else delete ev[s.id]});await db.collection("evaluations").doc(docId).set({date:dStr,coach:coachName,updatedAt:ymd()+" "+hm(),ev});AE=docId;toast(T("Penilaian tersimpan & grafik murid terbarui","Evaluations saved & student charts updated"))}
    if(a=="saveTok"){const t=($("#ghTok")||{}).value.trim();if(!t)return toast(T("Isi token GitHub dulu","Enter GitHub token first"));upTok=t;localStorage.setItem("gh_tok",t);toast(T("Token GitHub tersimpan","GitHub token saved"))}
    if(a=="saveLogo"){
      const tok=($("#ghTok")||{}).value.trim()||upTok;
      if(!pendingLogoUri)return toast(T("Pilih file gambar logo dulu","Select a logo image file first"));
      if(!tok)return toast(T("Isi GitHub Personal Access Token dulu","Enter GitHub Personal Access Token first"));
      upTok=tok;localStorage.setItem("gh_tok",tok);
      const resBox=$("#logoRes");
      resBox.innerHTML=`<span class="pill">${T("Menyimpan logo ke aplikasi utama...","Saving logo to main app...")}</span>`;
      try{
        const htmlRes=await fetch("/index.html",{cache:"no-store"});
        if(!htmlRes.ok)throw new Error(T("Gagal membaca index.html saat ini","Failed to read current index.html"));
        let htmlTxt=await htmlRes.text();
        const tag='<script id="logo-data">window.__LOGO_DATA__='+JSON.stringify(pendingLogoUri)+';<\/script>';
        if(/<script id="logo-data">[\s\S]*?<\/script>/i.test(htmlTxt)){
          htmlTxt=htmlTxt.replace(/<script id="logo-data">[\s\S]*?<\/script>/i,tag);
        }else{
          htmlTxt=htmlTxt.replace("</head>",tag+"</head>");
        }
        const r=await fetch("/api/deploy",{method:"POST",headers:__hdr({"content-type":"application/json"}),body:JSON.stringify({token:tok,mode:"direct",title:"Update Logo Supreme Taekwondo Club",files:[{path:"index.html",content:htmlTxt}]})});
        const d=await r.json();
        if(!r.ok)throw new Error(d.error||"HTTP "+r.status);
        resBox.innerHTML=`<div class="note">✓ <b>${T("Logo berhasil disimpan permanen!","Logo permanently saved!")}</b> ${T("Tunggu ~30 detik agar tampil di seluruh halaman & Portal Orang Tua.","Wait ~30 seconds for it to appear across all pages & Parent Portals.")} <a href="${esc(d.commitUrl||d.url||"#")}" target="_blank" rel="noopener">${T("Lihat Commit","View Commit")}</a></div>`;
        toast(T("Logo berhasil diterapkan!","Logo applied!"));
      }catch(err){
        resBox.innerHTML=`<div class="note" style="border-left-color:var(--rd)"><b>${T("Gagal menyimpan logo:","Failed to save logo:")}</b> ${esc(err.message)}</div>`;
      }
    }
    if(a=="deployDirect"||a=="deployPR"){

      const tok=($("#ghTok")||{}).value.trim()||upTok;

      const customTitle=($("#upTitle")||{}).value;

      let parsed;
      try{parsed=parseUpdatePayload(raw,customTitle)}catch(err){resBox.innerHTML=`<div class="note" style="border-left-color:var(--rd)"><b>${T("Format kode belum valid:","Invalid code format:")}</b> ${esc(err.message)}</div>`;return;}
      upTok=tok;localStorage.setItem("gh_tok",tok);
      resBox.innerHTML=`<span class="pill">${mode==="direct"?T("Mengupdate langsung ke branch main...","Updating directly to main branch..."):T("Membuat branch & Pull Request...","Creating branch & Pull Request...")}</span>`;
      try{
        const r=await fetch("/api/deploy",{method:"POST",headers:__hdr({"content-type":"application/json"}),body:JSON.stringify({token:tok,mode,title:parsed.title,files:parsed.files})});
        const d=await r.json();
        if(!r.ok)throw new Error(d.error||"HTTP "+r.status);
        if(d.direct||mode==="direct"){
          resBox.innerHTML=`<div class="note">✓ <b>${T("Berhasil diupdate langsung ke main!","Successfully updated directly to main!")}</b> (${esc(parsed.modeLabel)})<br>${T("Cloudflare Pages sedang rebuild (~30 detik). Silakan refresh halaman setelah 30 detik.","Cloudflare Pages is rebuilding (~30 seconds). Refresh the page after 30 seconds.")} <a href="${esc(d.commitUrl||d.url||"#")}" target="_blank" rel="noopener"><b>${T("Lihat Commit di GitHub →","View Commit on GitHub →")}</b></a></div>`;
          toast(T("Update langsung ke main berhasil!","Direct update to main succeeded!"));
        }else{
          resBox.innerHTML=`<div class="note">✓ <b>${T("Pull Request berhasil dibuat!","Pull Request created!")}</b> <a href="${esc(d.url)}" target="_blank" rel="noopener"><b>${T("Buka PR #","Open PR #")}${d.number} →</b></a></div>`;
          toast(T("PR #","PR #")+d.number+" "+T("berhasil dibuat!","created!"));
        }
      }catch(err){
        resBox.innerHTML=`<div class="note" style="border-left-color:var(--rd)"><b>${T("Gagal update:","Update failed:")}</b> ${esc(err.message)}</div>`;
      }
    }
  });
  (async()=>{
    db=await window.claude.use("db");
    const sub=(n,fn)=>db.collection(n).onSnapshot(s=>{fn(s.docs.map(d=>({id:d.id,...d.data()})));calc();render()});
    sub("students",x=>__rawStudents=x);
    sub("classes",x=>J=x);
    sub("attendance",x=>A=x);
    sub("evaluations",x=>E=x);
    sub("payments",x=>P=x);
    sub("units",x=>UList=x);
    sub("coaches",x=>C=x);
    render();
  })();
}
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
